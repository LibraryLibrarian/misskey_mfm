name: Publish to pub.dev

on:
  push:
    # プレリリースを含むバージョンタグをpub.dev側のtag patternで検証する
    tags: ['v*']

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dart-lang/setup-dart@v1

      - name: Verify tag commit is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Verify release version
        run: dart run tool/verify_release.dart "${GITHUB_REF_NAME#v}"

  publish:
    needs: verify
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      environment: pub.dev

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1

      - name: Extract release notes
        run: >-
          dart run tool/release_notes.dart "${GITHUB_REF_NAME#v}"
          > "$RUNNER_TEMP/release-notes.md"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_options=()
          if [[ "${GITHUB_REF_NAME#v}" == *-* ]]; then
            release_options+=(--prerelease --latest=false)
          fi

          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "${release_options[@]}"

  merge-back:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Merge main back into develop
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

          if git merge-base --is-ancestor origin/main HEAD; then
            echo "develop already contains main. Nothing to do."
            exit 0
          fi

          if git merge --no-ff -m "chore: merge back $GITHUB_REF_NAME into develop" origin/main \
            && git push origin develop; then
            echo "Merged main into develop."
            exit 0
          fi

          # 競合、またはブランチ保護により直接pushできない場合のフォールバック
          git merge --abort || true
          branch="chore/merge-back-$GITHUB_REF_NAME"
          git switch -c "$branch" origin/main
          git push -u --force-with-lease origin "$branch"
          gh pr create \
            --base develop \
            --head "$branch" \
            --title "chore: merge back $GITHUB_REF_NAME into develop" \
            --body "自動マージバックに失敗したため、手動での競合解決が必要。" \
            || echo "既存のPRがあるため作成をスキップした。"
          exit 1
